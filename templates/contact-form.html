<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .form-card {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 500px;
    }
    h2 { margin-bottom: 24px; color: #1a1a2e; font-size: 24px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 6px; color: #555; font-size: 14px; font-weight: 500; }
    input, textarea, select {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      transition: border-color 0.3s;
      outline: none;
      font-family: inherit;
    }
    input:focus, textarea:focus, select:focus { border-color: #007bff; }
    textarea { resize: vertical; min-height: 120px; }
    .btn {
      width: 100%;
      padding: 14px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }
    .btn:hover { background: #0056b3; }
    .success-msg {
      display: none;
      background: #d4edda;
      color: #155724;
      padding: 12px;
      border-radius: 8px;
      margin-top: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="form-card">
    <h2>📬 Contact Us</h2>
    <div class="form-group">
      <label for="name">Full Name *</label>
      <input type="text" id="name" placeholder="Enter your name" required>
    </div>
    <div class="form-group">
      <label for="email">Email Address *</label>
      <input type="email" id="email" placeholder="you@example.com" required>
    </div>
    <div class="form-group">
      <label for="subject">Subject</label>
      <select id="subject">
        <option value="">Select a subject...</option>
        <option>General Inquiry</option>
        <option>Technical Support</option>
        <option>Billing</option>
        <option>Partnership</option>
        <option>Other</option>
      </select>
    </div>
    <div class="form-group">
      <label for="message">Message *</label>
      <textarea id="message" placeholder="Write your message here..."></textarea>
    </div>
    <button class="btn" onclick="submitForm()">Send Message</button>
    <div class="success-msg" id="successMsg">✅ Message sent! We'll get back to you soon.</div>
  </div>

  <script>
    function submitForm() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const message = document.getElementById('message').value.trim();

      if (!name || !email || !message) {
        alert('Please fill in all required fields.');
        return;
      }

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        alert('Please enter a valid email address.');
        return;
      }

      // Show success (replace with actual API call)
      document.getElementById('successMsg').style.display = 'block';
      setTimeout(() => document.getElementById('successMsg').style.display = 'none', 4000);
    }
  </script>
</body>
</html>
